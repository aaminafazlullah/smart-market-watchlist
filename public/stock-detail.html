const money=n=>Number.isFinite(Number(n))?`$${Number(n).toFixed(2)}`:"--";
const pct=n=>Number.isFinite(Number(n))?`${Number(n)>=0?"+":""}${Number(n).toFixed(2)}%`:"--";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ist=ts=>{const d=new Date(ts);return Number.isNaN(d.getTime())?"--":new Intl.DateTimeFormat("en-IN",{timeZone:"Asia/Kolkata",hour:"numeric",minute:"2-digit",hour12:true}).format(d)+" IST"};
const ago=ts=>{if(!ts)return"--";const m=Math.max(0,Math.floor((Date.now()-new Date(ts).getTime())/60000));return m<1?"just now":m<60?m+"m ago":Math.floor(m/60)+"h ago"};
async function getJson(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json()}
function render(q,s,n){
 const price=Number(q.price??s.currentPrice),ch=Number(q.change??0),cp=Number(q.changePercent??s.changePercent??0),score=Number(s.changeScore??0);
 const sev=score>=80?"CRITICAL":score>=60?"HIGH":score>=30?"MEDIUM":"LOW";
 const sig=[["Price Movement",s.signals?.price??0,"40% weight"],["Volume Anomaly",s.signals?.volume??0,"25% weight"],["News Activity",s.signals?.news??0,"20% weight"],["Earnings & Events",s.signals?.earnings??0,"15% weight"]];
 const reasons=Array.isArray(s.reasons)&&s.reasons.length?s.reasons:["No major changes detected"];
